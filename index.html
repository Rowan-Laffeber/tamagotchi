<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="assets/style/main.css">
</head>


<body id="Body">
    <div class="Counters">
        <h2 class="Counter" id="HealthInfo">-</h2><button onclick="HealthDamage()">Health damage</button>
        <h2 class="Counter" id="EnergyInfo">-</h2><button onclick="EnergyDamage()">Energy damage</button>
        <h2 class="Counter" id="DeadeyeInfo">-</h2><button onclick="DeadeyeDamage()">Deadeye damage</button>
    </div>
    <div class="Stats" id="Stats">
        <canvas class="IconHeart" id="HealthCore" width="70" height="70"></canvas>
        <div id="HealthLevels" class="HealthLevels">
            <canvas id="HealthLevel" width="130" height="130"></canvas>
            <canvas id="HealthRegen" width="130" height="130"></canvas>
        </div>
        <canvas class="IconEnergy" id="EnergyCore" width="70" height="70"></canvas>
        <div id="EnergyLevels" class="EnergyLevels">
            <canvas id="EnergyLevel" width="130" height="130"></canvas>
            <canvas id="EnergyRegen" width="130" height="130"></canvas>
        </div>
        <canvas class="IconDeadeye" id="DeadeyeCore" width="70" height="70"></canvas>
        <div id="DeadeyeLevels" class="DeadeyeLevels">
            <canvas id="DeadeyeLevel" width="130" height="130"></canvas>
            <canvas id="DeadeyeRegen" width="130" height="130"></canvas>
        </div>
    </div>
    <div class="Arthurs" id="Arthurs">
        <img id="SpeechBubbleHungry" class="SpeechBubbleHungry" src="assets/img/SpeechBubbleHungry.png" alt="">
        <img id="SpeechBubbleSleep" class="SpeechBubbleSleep" src="assets/img/SpeechBubbleSleep.png" alt="">
        <img id="SpeechBubbleSmoke" class="SpeechBubbleSmoke" src="assets/img/SpeechBubbleSmoke.png" alt="">
    </div>
    <canvas class="Sprite" id="ArthurCanvas" width="320" height="320"></canvas>
    <div id="Arthur" class="Sprite"></div>

    <div class="Environment" id="Environment">
        <div class="Plants" id="Plants">
            <div class="AppleTree" id="AppleTree">
                <img class="Tree" src="assets/img/tree.png" alt="">
                <img class="AppleGround" src="assets/img/apple-ground.png" alt="" id="eat" onclick="Eat()">
                <img class="AppleTree1" src="assets/img/apple-in-tree.png" alt="">
                <img class="AppleTree2" src="assets/img/apple-in-tree.png" alt="">
                <img class="AppleTree3" src="assets/img/apple-in-tree.png" alt="">
                <img class="AppleTree4" src="assets/img/apple-in-tree.png" alt="">
                <img class="AppleTree5" src="assets/img/apple-in-tree.png" alt="">
            </div>
            <div class="Home">
                <img class="Home" src="assets/img/Home/home2.png" alt="" onclick="Sleep()">
                <img class="campfire" src="assets/img/Home/campfire.png" alt="" onclick="Smoke()">
            </div>

            <img class="Grass" src="assets/img/grass.png" alt="">
            <img class="Stone" src="assets/img/stone.png" alt="">
        </div>
    </div>
    <div class="Weather" id="Weather">
        <div class="clouds" id="Clouds">
            <img id="Cloud1" class="Cloud1" src="assets/img/cloud3.png" alt="">
            <img id="Cloud2" class="Cloud2" src="assets/img/cloud3.png" alt="">
            <img id="Cloud3" class="Cloud3" src="assets/img/cloud3.png" alt="">
            <img id="Cloud4" class="Cloud4" src="assets/img/cloud3.png" alt="">
            <img id="Cloud5" class="Cloud5" src="assets/img/cloud3.png" alt="">
            <img id="Cloud6" class="Cloud6" src="assets/img/cloud3.png" alt="">
        </div>
        <div class="DayNight" id="DayNight">
            <img class="Sun" id="Sun" src="assets/img/sun.png" alt="">
            <img class="Moon" id="Moon" src="assets/img/moon.png" alt="">
        </div>
    </div>
    <div class="Box" id="Box">
        <img src="assets/img/startscreen.png" alt="Start Box" class="BoxImage">
        <img src="assets/img/startbutton.png" alt="Start Button" id="StartBtn" class="StartButton">
    </div>
    <audio id="BackgroundMusic" src="assets/background-music/Reddead.mp3" loop></audio>
    <!-- <div id="Arthur">
            </div> -->
    <script src="script/main.js"></script>
</body>
</html>
