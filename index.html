<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="assets/style/main.css">
</head>


<body id="body">
    <div class="counters">
        <h2 class="counter" id="CountDown1">-</h2>
        <h2 class="counter" id="CountDown2">-</h2><button id="Sleep" onclick="sleep()">slaap</button>
        <h2 class="counter" id="CountDown3">-</h2><button id="Smoke" onclick="Smoke()">rook</button>
    </div>
    <div class="stats" id="stats">
        <canvas class="icon-heart" id="HealthCore" width="70" height="70"></canvas>
        <div id="HealthLevels" class="healthlevels">
            <canvas id="HealthLevel" width="130" height="130"></canvas>
            <canvas id="HealthRegen" width="130" height="130"></canvas>
        </div>
        <canvas class="icon-energy" id="EnergyCore" width="70" height="70"></canvas>
        <div id="EnergyLevels" class="EnergyLevels">
            <canvas id="EnergyLevel" width="130" height="130"></canvas>
            <canvas id="EnergyRegen" width="130" height="130"></canvas>
        </div>
        <canvas class="icon-deadeye" id="DeadeyeCore" width="70" height="70"></canvas>
        <div id="DeadeyeLevels" class="DeadeyeLevels">
            <canvas id="DeadeyeLevel" width="130" height="130"></canvas>
            <canvas id="DeadeyeRegen" width="130" height="130"></canvas>
        </div>
    </div>
    <div class="Arthurs" id="Arthurs">
        <img id="SpeechBubble" class="speech-bubble" src="assets/img/speech-bubble.png" alt="">
    </div>
    <canvas class="sprite" id="ArthurCanvas" width="320" height="320"></canvas>
    <div id="arthur" class="sprite"></div>

    <div class="environment" id="environment">
        <div class="plants" id="plants">
            <div class="AppleTree" id="AppleTree">
                <img class="tree" src="assets/img/tree.png" alt="">
                <img class="apple-ground" src="assets/img/apple-ground.png" alt="" id="eat" onclick="eat()">
                <img class="apple-tree1" src="assets/img/apple-in-tree.png" alt="">
                <img class="apple-tree2" src="assets/img/apple-in-tree.png" alt="">
                <img class="apple-tree3" src="assets/img/apple-in-tree.png" alt="">
                <img class="apple-tree4" src="assets/img/apple-in-tree.png" alt="">
                <img class="apple-tree5" src="assets/img/apple-in-tree.png" alt="">
            </div>
            <div class="home">
                <img class="home" src="assets/img/Home/home.png" alt="">
            </div>
            <img class="grass" src="assets/img/grass.png" alt="">
            <img class="stone" src="assets/img/stone.png" alt="">
        </div>
    </div>
    <div class="weather" id="weather">
        <div class="clouds" id="Clouds">
            <img id="Cloud1" class="cloud1" src="assets/img/cloud3.png" alt="">
            <img id="Cloud2" class="cloud2" src="assets/img/cloud3.png" alt="">
            <img id="Cloud3" class="cloud3" src="assets/img/cloud3.png" alt="">
            <img id="Cloud4" class="cloud4" src="assets/img/cloud3.png" alt="">
            <img id="Cloud5" class="cloud5" src="assets/img/cloud3.png" alt="">
            <img id="Cloud6" class="cloud6" src="assets/img/cloud3.png" alt="">
        </div>
        <div class="day-night" id="DayNight">
            <img class="sun" id="Sun" src="assets/img/sun.png" alt="">
            <img class="moon" id="Moon" src="assets/img/moon.png" alt="">
        </div>
    </div>
    <div class="box" id="Box">
        <h1>Red Dead Redemption Pixel</h1>
        <p>Press start to begin!</p>
        <button class="start" id="StartBtn">Start</button>
    </div>
    <audio id="BackgroundMusic" src="assets/background-music/Reddead.mp3" loop></audio>
        <!-- <div id="Arthur">
            </div> -->
    <script src="script/main.js"></script>
</body>

</html>
